<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: classic institutional portal. Top strip, identity header, mega-nav, teal news band with 4 raised cards, messages, notice board, footer. */
:root{
  --bg:#ffffff; --surface:#ffffff; --fg:#1d2b33; --muted:#5b6b75; --line:#dfe6ea;
  --teal:#0e9fa6; --teal-d:#0a7d83; --teal-soft:#e4f5f6;
  --plum:#7a1f7c; --plum-d:#5d1560; --orange:#e8820c; --red:#d93a3a; --pink:#d81b60;
  --band:#13b5bd; --on-band:#ffffff; --nav-fg:#0a7d83; --head-fg:#16232b;
  --shadow:0 6px 18px rgba(20,40,50,.18);
  --f-body:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --f-head:'Barlow Condensed','Hind Siliguri',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#16222a; --fg:#e6eef2; --muted:#9db0ba; --line:#263640;
  --teal:#2cc4cc; --teal-d:#2cc4cc; --teal-soft:#13303a;
  --plum:#b05bb3; --plum-d:#c377c6; --band:#0b6f75; --nav-fg:#5fd6dc; --head-fg:#f1f6f8;
  --shadow:0 6px 18px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#16222a; --fg:#e6eef2; --muted:#9db0ba; --line:#263640;
  --teal:#2cc4cc; --teal-d:#2cc4cc; --teal-soft:#13303a;
  --plum:#b05bb3; --plum-d:#c377c6; --band:#0b6f75; --nav-fg:#5fd6dc; --head-fg:#f1f6f8;
  --shadow:0 6px 18px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top strip */
.strip{background:var(--teal);color:#fff;font-weight:600;font-size:14px}
.strip .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:7px}
.strip a{margin-left:14px;font-weight:700}
.demo-flag{background:#fff3c4;color:#5a4300;text-align:center;font-size:13px;padding:5px 12px}

/* identity */
.ident .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding-block:22px}
.logo{width:92px;height:92px}
.ident h1{margin:0;text-align:center;line-height:1.15;color:var(--head-fg)}
.ident h1 .bn{display:block;font-size:clamp(28px,4.6vw,46px);font-weight:700}
.ident h1 .en{display:block;font-family:var(--f-head);font-size:clamp(26px,4.2vw,42px);font-weight:700;letter-spacing:.3px}
.contact{font-size:13px;color:var(--muted);line-height:1.5;min-width:0}
.contact b{color:var(--fg);display:block;margin-top:6px}
.contact span{overflow-wrap:anywhere}

/* nav */
.nav{background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px}
.menu{display:flex;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.menu>li{position:relative}
.menu>li>a,.menu>li>button{display:block;background:none;border:0;cursor:pointer;color:var(--nav-fg);font-family:var(--f-head);font-weight:600;font-size:15px;letter-spacing:.4px;text-transform:uppercase;padding:14px 11px}
.menu>li.active>a,.menu>li.active>button,.menu>li>a:hover,.menu>li>button:hover{color:var(--plum)}
.drop{display:none;position:absolute;left:0;top:100%;min-width:230px;background:var(--teal);box-shadow:var(--shadow);list-style:none;margin:0;padding:6px 0;z-index:40}
.drop a{display:block;color:#fff;font-size:14px;padding:9px 18px;border-bottom:1px solid rgba(255,255,255,.18)}
.drop li:last-child a{border:0}
.drop a:hover{background:var(--teal-d);padding-left:24px}
.menu>li.open .drop{display:block}
@media (hover:hover) and (min-width:861px){.menu>li:hover .drop{display:block}}
.pay{background:var(--plum);color:#fff;font-family:var(--f-head);font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:10px 22px;border-radius:999px;white-space:nowrap}
.pay:hover{background:var(--plum-d)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
.theme{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}

/* news band */
.band{background:var(--band);color:var(--on-band)}
.news{display:flex;align-items:center;gap:14px;padding-block:14px;font-weight:600}
.news strong{white-space:nowrap}
.ticker{overflow:hidden;flex:1;min-width:0}
.ticker div{display:inline-block;white-space:nowrap;padding-left:100%;animation:tick 38s linear infinite}
.ticker:hover div{animation-play-state:paused}
.ticker span{margin-right:44px}
@keyframes tick{to{transform:translateX(-100%)}}
.cta{text-align:center;padding:14px 0 54px}
.cta a.big{display:inline-block;background:var(--pink);color:#fff;font-weight:700;font-size:19px;padding:11px 26px;border:3px solid rgba(255,255,255,.55)}
.cta p{margin:8px 0 0;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:-60px;position:relative}
.card{display:block;text-align:center;color:#fff;padding:54px 16px 24px;border-radius:6px;box-shadow:var(--shadow);position:relative;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card .ico{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:84px;height:62px;border-radius:50% 50% 0 0;display:grid;place-items:center;background:inherit}
.card svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0 0 6px;font-size:20px}
.card p{margin:0;font-size:14px;opacity:.95}
.c1{background:var(--teal-d)}.c2{background:var(--orange)}.c3{background:var(--plum)}.c4{background:var(--red)}
.band + .spacer{height:80px}

/* sections */
.title{font-family:var(--f-head);text-transform:uppercase;font-size:32px;letter-spacing:.5px;text-align:center;margin:0;color:var(--head-fg)}
.title em{font-style:normal;color:var(--orange)}
.title+i{display:block;width:70px;height:3px;background:var(--plum);margin:8px auto 28px}
section.block{padding-block:42px}
.msgs{background:linear-gradient(rgba(10,60,70,.78),rgba(10,60,70,.78)),repeating-linear-gradient(45deg,#2a7f8c 0 14px,#2f8896 14px 28px);color:#fff;padding-block:48px 56px}
.msgs .title{color:#fff;margin-bottom:34px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,380px));gap:28px;justify-content:center}
.msg{background:var(--surface);color:var(--fg);padding:46px 22px 22px;position:relative;box-shadow:var(--shadow);margin-top:40px}
.avatar{position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:80px;height:80px;border-radius:50%;background:var(--teal-soft);border:4px solid var(--surface);display:grid;place-items:center}
.avatar svg{width:46px;height:46px;fill:var(--muted)}
.msg h3{margin:0 0 8px;color:var(--plum);font-size:19px}
.msg p{margin:0 0 14px;color:var(--muted);font-size:15px}
.btn{display:inline-block;background:var(--plum);color:#fff;font-size:13px;font-weight:600;padding:6px 14px;border:0;cursor:pointer;border-radius:3px}
.btn:hover{background:var(--plum-d)}

.notice{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:26px;align-items:start}
.nb-left{background:var(--teal);color:#fff;padding:20px;min-height:300px;box-shadow:var(--shadow)}
.nb-left a{display:block;border-bottom:1px solid rgba(255,255,255,.35);padding:10px 0;font-size:15px}
.nb-left a:hover{padding-left:6px}
.new{background:var(--red);font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;margin-left:6px}
.acc{border:0}
.acc>button{width:100%;text-align:left;background:var(--plum);color:#fff;border:0;padding:12px 18px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;margin-bottom:8px}
.acc>button[aria-expanded="false"]{background:var(--surface);color:var(--plum);border:1px solid var(--line)}
.acc .pane{border:1px solid var(--line);margin:-8px 0 10px;background:var(--surface)}
.pane table{width:100%;border-collapse:collapse;font-size:14.5px}
.pane th,.pane td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.pane td:first-child{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}

/* inner pages */
.hero{background:linear-gradient(rgba(35,25,45,.78),rgba(35,25,45,.78)),repeating-linear-gradient(-45deg,#6a5a7a 0 16px,#5f506f 16px 32px);color:#fff;text-align:center;padding:44px 16px}
.hero h2{margin:0 0 6px;font-family:var(--f-head);font-size:34px;text-transform:uppercase;letter-spacing:.8px}
.crumb{font-weight:600}.crumb b{color:#ff6b6b}
.page{padding-block:44px 70px;max-width:760px}
.page h3.sub{color:var(--plum);font-size:24px;margin:0 0 22px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
.field label{display:block;font-size:14px;margin-bottom:4px;color:var(--muted)}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:2px;min-width:0}
.field input:focus,.field select:focus{border-color:var(--teal)}
.submit{grid-column:1/-1;background:#c91f1f;color:#fff;border:0;padding:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;cursor:pointer}
.submit:hover{background:#a81818}
.hint{font-size:14px;color:var(--muted);background:var(--teal-soft);padding:10px 14px;margin:0 0 22px;border-left:3px solid var(--teal)}
.err{color:var(--red);font-weight:600;margin-top:14px}

.sheet-scroll{overflow-x:auto;margin-top:26px}
.sheet{min-width:640px;position:relative;background:#fff;color:#1b1b1b;padding:26px 28px;border:6px double #d94f6b;outline:4px dotted #e9a53a;outline-offset:6px;font-size:14px}
.sheet::after{content:"DEMO";position:absolute;inset:0;display:grid;place-items:center;font:700 140px var(--f-head);color:rgba(217,79,107,.10);transform:rotate(-24deg);pointer-events:none}
.sheet h4{margin:0;text-align:center;font-size:21px}
.sheet .addr{text-align:center;font-size:12.5px;margin:2px 0 10px}
.sheet h5{text-align:center;text-decoration:underline;font-size:17px;margin:10px 0 12px}
.sheet dl{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 14px;margin:0 0 14px;font-size:13.5px}
.sheet dt{font-weight:600}.sheet dd{margin:0}
.sheet table{width:100%;border-collapse:collapse;font-size:13px;text-align:center}
.sheet th,.sheet td{border:1px solid #bbb;padding:5px 6px}
.sheet th{background:#eef2f4}
.sheet td.l{text-align:left}
.sum{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px;font-weight:600}
.pass{color:#0a7a2e}.fail{color:#c21f1f}

footer{background:#10252b;color:#c8d8dd;padding-block:38px 26px}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px}
footer h4{margin:0 0 10px;color:#fff;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.6px;font-size:18px}
footer a{display:block;padding:2px 0;font-size:14.5px}footer a:hover{color:#fff}
footer p{margin:0 0 6px;font-size:14.5px}
.copy{border-top:1px solid #234049;margin-top:24px;padding-top:14px;font-size:13px;text-align:center}
.top{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:42px;height:42px;background:var(--plum);color:#fff;border:0;cursor:pointer;display:none;z-index:35;font-size:20px}
.top.on{display:block}

@media (max-width:860px){
  .ident .wrap{grid-template-columns:1fr;justify-items:center;text-align:center}
  .contact{text-align:center}
  .burger{display:block}
  .nav .wrap{flex-wrap:wrap}
  .menu{display:none;width:100%;order:3;flex-direction:column}
  .menu.show{display:flex}
  .drop{position:static;box-shadow:none}
  .cards{grid-template-columns:1fr 1fr;row-gap:56px}
  .notice,.fgrid{grid-template-columns:1fr}
  .mgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .cards{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .sheet dl{grid-template-columns:auto 1fr}
}
@media (prefers-reduced-motion:reduce){.ticker div{animation:none;padding-left:0;white-space:normal}.card,.nb-left a{transition:none}}
</style>

$('#contact').innerHTML='<b>Call Us</b><span>'+esc(SITE.phones)+'</span><b>Mail Us</b><span>'+esc(SITE.email)+'</span>';
$('#fName').textContent=SITE.nameEn; $('#fAddr').textContent=SITE.address; $('#fPhone').textContent=SITE.phones; $('#fMail').textContent=SITE.email;
$('#copy').textContent='© '+new Date().getFullYear()+' '+SITE.nameEn+'. Demo template.';

/* menu */
function buildMenu(){
  $('#menu').innerHTML=SITE.menu.map((m,i)=>{
    if(!m.items) return `<li data-key="${m.to}"><a href="#${m.to}">${esc(m.t)}</a></li>`;
    const sub=m.items.map(x=>{const [t,to]=Array.isArray(x)?x:[x,'p-'+slug(m.t)+'-'+slug(x)];return `<li><a href="#${to}" data-title="${esc(t)}">${esc(t)}</a></li>`}).join('');
    return `<li data-group="${i}"><button aria-expanded="false" aria-haspopup="true">${esc(m.t)} &#9662;</button><ul class="drop">${sub}</ul></li>`;
  }).join('');
}
buildMenu();
$('#menu').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b){const li=b.parentElement,was=li.classList.contains('open');
    document.querySelectorAll('.menu>li.open').forEach(x=>{x.classList.remove('open');x.firstElementChild.setAttribute('aria-expanded','false')});
    if(!was){li.classList.add('open');b.setAttribute('aria-expanded','true')}return}
  if(e.target.closest('a')){closeMenus();$('#menu').classList.remove('show');$('#burger').setAttribute('aria-expanded','false')}
});
function closeMenus(){document.querySelectorAll('.menu>li.open').forEach(x=>{x.classList.remove('open');x.firstElementChild.setAttribute('aria-expanded','false')})}
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))closeMenus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});
$('#burger').onclick=()=>{const s=$('#menu').classList.toggle('show');$('#burger').setAttribute('aria-expanded',s)};

/* theme toggle */
$('#theme').onclick=()=>{
  const r=document.documentElement,cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  r.setAttribute('data-theme',cur==='dark'?'light':'dark');
};

/* views */
const views={
  home(){
    const t=SITE.ticker.map(x=>`<span>&#9654;&#9654; ${esc(x)}</span>`).join('');
    const cards=SITE.cards.map(c=>`<a class="card ${c.cls}" href="#${c.to}"><span class="ico">${ICONS[c.icon]}</span><h3>${esc(c.t)}</h3><p>${esc(c.d)}</p></a>`).join('');
    const msgs=SITE.messages.map(m=>`<article class="msg"><span class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c0-4.6 3.8-7.4 8.5-7.4s8.5 2.8 8.5 7.4z"/></svg></span><h3>${esc(m.t)}</h3><p>${esc(m.p)}</p><a class="btn" href="#contact">Read More &raquo;</a></article>`).join('');
    return `
    <div class="band"><div class="wrap">
      <div class="news"><strong>Latest News :</strong><div class="ticker" aria-label="Latest news"><div>${t}</div></div></div>
      <div class="cta"><a class="big" href="#admission">${esc(SITE.admissionLine)}</a><p>${esc(SITE.helpline)}</p></div>
      <div class="cards">${cards}</div>
    </div></div>
    <div class="spacer" style="height:84px"></div>
    <section class="msgs"><div class="wrap"><h2 class="title">Message</h2><div class="mgrid">${msgs}</div></div></section>
    <section class="block"><div class="wrap"><h2 class="title">Latest <em>Notice</em></h2><i></i>${noticeBoard()}</div></section>`;
  },
  notice(){return `<div class="hero"><h2>Notice</h2><div class="crumb">Home // <b>All Notice</b></div></div><section class="block"><div class="wrap">${noticeBoard()}</div></section>`},
  result(){
    const o=a=>a.map(x=>`<option>${x}</option>`).join('');
    return `<div class="hero"><h2>Result</h2><div class="crumb">Result // <b>Individual Result Search</b></div></div>
    <div class="wrap page"><h3 class="sub">Individual Result Search</h3>
      <form class="form" id="rf" novalidate>
        <div class="field"><label for="r-roll">Class Roll*</label><input id="r-roll" inputmode="numeric" required></div>
        <div class="field"><label for="r-cls">Class*</label><select id="r-cls">${o(CLASSES)}</select></div>
        <div class="field"><label for="r-grp">Department/Section/Group*</label><select id="r-grp">${o(GROUPS)}</select></div>
        <div class="field"><label for="r-shift">Shift*</label><select id="r-shift"><option>All Shift</option><option>Morning</option><option>Day</option></select></div>
        <div class="field"><label for="r-ses">Session*</label><select id="r-ses">${o(SESSIONS)}</select></div>
        <div class="field"><label for="r-exam">Exam*</label><select id="r-exam"><option value="">Select Exam</option>${o(EXAMS)}</select></div>
        <button class="submit" type="submit">View Result</button>
      </form>
      <div id="out" aria-live="polite"></div></div>`;
  },
  login(){return simple('Login','Sign in to the admin, teacher, staff or student panel. Connect this form to your own login system.')},
  admission(){return simple('Admission Form','Online admission form. Add your application fields here and connect them to your own backend.')},
  fees(){return simple('Fees Payment','Connect your payment gateway (for example bKash, Nagad or a bank gateway) here.')},
  gallery(){return simple('Photo Gallery','Upload your event photos here.')},
  contact(){return simple('Contact',`${SITE.address}<br>${SITE.phones}<br>${SITE.email}`,true)}
};
function simple(title,text,raw){return `<div class="hero"><h2>${esc(title)}</h2><div class="crumb">Home // <b>${esc(title)}</b></div></div><div class="wrap page"><h3 class="sub">${esc(title)}</h3><p>${raw?text:esc(text)}</p></div>`}

function noticeBoard(){
  const keys=Object.keys(SITE.notices);
  const first=SITE.notices[keys[0]].slice(0,3).map(n=>`<a href="#notice">&#128197; ${n[0]} &#9654; ${esc(n[1])}${n[2]?'<span class="new">NEW</span>':''}</a>`).join('');
  const acc=keys.map((k,i)=>{
    const rows=SITE.notices[k].map(n=>`<tr><td>${n[0]}</td><td>${esc(n[1])}</td></tr>`).join('');
    return `<div class="acc"><button aria-expanded="${i===0}" data-acc="${i}">${esc(k)} <span>${i===0?'&#9662;':'&#9656;'}</span></button><div class="pane" ${i===0?'':'hidden'}><table><thead><tr><th>Date</th><th>Heading</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}).join('');
  return `<div class="notice"><div class="nb-left">${first}</div><div id="accs">${acc}</div></div>`;
}

/* result lookup */
const pt=m=>m>=80?5:m>=70?4:m>=60?3.5:m>=50?3:m>=40?2:m>=33?1:0;
const lg=m=>m>=80?'A+':m>=70?'A':m>=60?'A-':m>=50?'B':m>=40?'C':m>=33?'D':'F';
function sheet(r){
  let total=0,pts=0,n=0,fail=false,bonus=0;
  const rows=r.subjects.map((s,i)=>{
    const t=s[2].reduce((a,b)=>a+b,0),p=pt(t);
    if(s[3]){bonus=Math.max(0,p-2)}else{pts+=p;n++;if(p===0)fail=true}
    total+=t;
    return `<tr><td>${i+1}</td><td class="l">${esc(s[0])}</td><td>${s[1]}</td><td>${s[2][0]||''}</td><td>${s[2][1]||''}</td><td>${s[2][2]||''}</td><td>${t}</td><td>${p}</td><td>${lg(t)}</td></tr>`}).join('');
  const gpa=fail?0:Math.min(5,(pts+bonus)/n);
  return `<div class="sheet-scroll"><div class="sheet">
    <h4>${esc(SITE.nameEn)}</h4><div class="addr">${esc(SITE.address)}</div>
    <h5>Academic Transcript (Sample)</h5>
    <dl><dt>Student's Name</dt><dd>${esc(r.name)}</dd><dt>Roll No.</dt><dd>${r.roll}</dd>
      <dt>Father's Name</dt><dd>${esc(r.father)}</dd><dt>Student ID</dt><dd>${r.sid}</dd>
      <dt>Mother's Name</dt><dd>${esc(r.mother)}</dd><dt>Class</dt><dd>${r.cls}</dd>
      <dt>Session</dt><dd>${r.session}</dd><dt>Group</dt><dd>${r.group}</dd>
      <dt>Exam</dt><dd>${r.exam}</dd><dt></dt><dd></dd></dl>
    <table><thead><tr><th>#</th><th>Subject</th><th>Full</th><th>Subjective</th><th>Objective</th><th>Practical</th><th>Total</th><th>GP</th><th>Grade</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="sum"><span>Total: ${total}</span><span>GPA: ${gpa.toFixed(2)}</span><span>Result: <span class="${fail?'fail':'pass'}">${fail?'Failed':'Passed'}</span></span></div>
  </div></div>`;
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='rf')return;e.preventDefault();
  const v=id=>$('#'+id).value.trim(),out=$('#out');
  if(!v('r-roll')||!v('r-exam')){out.innerHTML='<p class="err">Enter the class roll and choose an exam.</p>';return}
  const r=RESULTS.find(x=>x.roll===v('r-roll')&&x.cls===v('r-cls')&&x.group===v('r-grp')&&x.session===v('r-ses')&&x.exam===v('r-exam'));
  out.innerHTML=r?sheet(r):'<p class="err">No result found for these details. Check the roll, class, group, session and exam.</p>';
  if(r)out.scrollIntoView({behavior:'smooth',block:'start'});
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-acc]');if(!b)return;
  document.querySelectorAll('#accs .acc').forEach(a=>{const bt=a.firstElementChild,pn=a.lastElementChild,me=bt===b&&bt.getAttribute('aria-expanded')!=='true';
    bt.setAttribute('aria-expanded',me);pn.hidden=!me;bt.lastElementChild.innerHTML=me?'&#9662;':'&#9656;'});
});

/* router */
function route(){
  const h=(location.hash||'#home').slice(1)||'home';
  let html;
  if(views[h])html=views[h]();
  else{const a=document.querySelector(`.drop a[href="#${h}"]`);html=simple(a?a.dataset.title:'Page','Add the content for this page here.')}
  $('#view').innerHTML=html;
  document.querySelectorAll('.menu>li').forEach(li=>{
    const on=li.dataset.key===h||!!li.querySelector(`a[href="#${h}"]`);li.classList.toggle('active',on)});
  scrollTo(0,0);
}
addEventListener('hashchange',route);route();
const topBtn=$('#top');
addEventListener('scroll',()=>topBtn.classList.toggle('on',scrollY>400),{passive:true});
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
</script>
